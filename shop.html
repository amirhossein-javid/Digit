<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="فروشگاه نُوا؛ جستجو، فیلتر و مرتب‌سازی محصولات دیجیتال">
  <title>فروشگاه | نُوا</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="shop">
  <div data-site-header></div>
  <main class="page-main">
    <section class="page-hero container"><span>فروشگاه نُوا</span><h1>محصولات دیجیتال</h1><p>محصولات را بر اساس نام و دسته‌بندی جستجو کنید و با مرتب‌سازی مناسب، سریع‌تر به انتخاب دلخواه برسید.</p></section>
    <section class="shop-layout container">
      <form class="filter-panel" action="shop.html" method="get"><label>جستجو<input id="shopSearch" name="q" type="search" placeholder="نام یا دسته‌بندی"></label><label>دسته‌بندی<select id="categoryFilter" name="category"><option value="">همه دسته‌ها</option><option>گوشی موبایل</option><option>لپ‌تاپ</option><option>صوتی</option><option>پوشیدنی هوشمند</option><option>خانه هوشمند</option><option>دوربین</option><option>تبلت</option><option>تصویربرداری هوایی</option><option>گیمینگ</option></select></label><label>مرتب‌سازی<select id="sortFilter" name="sort"><option value="default">پیش‌فرض</option><option value="price-asc">قیمت: کم به زیاد</option><option value="price-desc">قیمت: زیاد به کم</option><option value="name">نام محصول</option></select></label><button class="btn btn--primary" type="submit">اعمال فیلتر</button><a class="filter-reset" href="shop.html">پاک‌کردن فیلترها</a></form>
      <div class="shop-results"><div class="results-head"><h2>محصولات</h2><span id="resultCount"></span></div><div class="product-grid shop-grid" id="shopProducts"></div></div>
    </section>
  </main>
  <div data-site-footer></div>
  <div class="overlay"></div><div class="toast" role="status" aria-live="polite"></div><script src="assets/js/catalog.js"></script><script src="assets/js/main.js"></script><script src="assets/js/pages.js"></script>
</body></html>
